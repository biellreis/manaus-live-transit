<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121A2A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Bus Silhouette -->
  <g filter="url(#glow)">
    <!-- Bus Body Outline -->
    <rect x="120" y="100" width="272" height="300" rx="36" fill="none" stroke="url(#neonGrad)" stroke-width="18"/>
    
    <!-- Windshield -->
    <rect x="150" y="140" width="212" height="100" rx="16" fill="rgba(0, 229, 163, 0.15)" stroke="url(#neonGrad)" stroke-width="12"/>
    
    <!-- Destination Sign / LED -->
    <rect x="180" y="115" width="152" height="18" rx="6" fill="#00E5A3"/>
    
    <!-- Headlights -->
    <circle cx="170" cy="300" r="22" fill="#00E5A3"/>
    <circle cx="342" cy="300" r="22" fill="#00E5A3"/>
    
    <!-- Grille Accent Line -->
    <line x1="220" y1="300" x2="292" y2="300" stroke="url(#neonGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Wheels -->
    <rect x="96" y="340" width="24" height="48" rx="8" fill="#FF5E1E"/>
    <rect x="392" y="340" width="24" height="48" rx="8" fill="#FF5E1E"/>
  </g>
</svg>
